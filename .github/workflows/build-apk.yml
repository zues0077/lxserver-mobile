name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets.* is NOT allowed in `if:` expressions; compute the presence of the
    # signing key once here (secrets IS allowed in `env:`) and gate steps with it.
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found at $SDKMANAGER; relying on the preinstalled Android SDK."
          fi
          echo "ANDROID_HOME is $ANDROID_HOME"

      # NOTE: the built-in (bundled) frontend was removed — it was unreliable and
      # is no longer part of the app. The client now always loads the user's own
      # server URL directly in the system WebView.
      # A debug build is normally signed with a randomly generated key, which differs
      # on every CI run — Android then refuses to update the installed app and the
      # user must uninstall first. Keep a FIXED debug keystore (committed at
      # app/debug.keystore) so consecutive builds stay signature-compatible.
      - name: Ensure stable debug keystore
        run: |
          KEY="app/debug.keystore"
          if [ -f "$KEY" ]; then
            echo "Using the committed debug keystore (stable signature)."
          else
            echo "No committed keystore yet - generating one (committed afterwards)."
            keytool -genkeypair -v \
              -keystore "$KEY" \
              -storetype JKS \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode signing keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "${{ github.workspace }}/keystore.jks"

      - name: Install Gradle 8.9 (no wrapper needed)
        run: |
          curl -sL --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          mv gradle-8.9 gradle-home

      - name: Build Release APK (signed)
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradle-home/bin/gradle assembleRelease --no-daemon

      - name: Build Debug APK (no signing key configured)
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: ./gradle-home/bin/gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxserver-mobile-apk
          path: app/build/outputs/apk
          if-no-files-found: error

      # Only needed once: lets us commit the generated keystore so later runs reuse
      # the same signature. Harmless (and a no-op) once app/debug.keystore is committed.
      - name: Upload debug keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: app/debug.keystore
          if-no-files-found: warn

      # Publish a GitHub Release with the APK attached. Done via the REST API
      # (not a third-party action) so it works reliably in any environment.
      - name: Publish Release (tag builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          mapfile -t APKS < <(find app/build/outputs/apk -name '*.apk' | sort)
          if [ ${#APKS[@]} -eq 0 ]; then echo "No APK found, skipping release"; exit 0; fi
          REL_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"generate_release_notes\":true}" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" | jq -r '.id')
          fi
          echo "Release id: $REL_ID"
          ASSETS_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets")
          for APK in "${APKS[@]}"; do
            BASE=$(basename "$APK")
            # app-<abi>-debug.apk -> keep the <abi>; plain app-debug.apk -> no suffix
            ABI=$(echo "$BASE" | sed -nE 's/^app-(.*)-(debug|release)\.apk$/\1/p')
            if [ -z "$ABI" ]; then
              NAME="lxserver-mobile-${VER}.apk"
            else
              NAME="lxserver-mobile-${VER}-${ABI}.apk"
            fi
            echo "==> $APK -> $NAME"
            EXISTING=$(echo "$ASSETS_JSON" | jq -r ".[] | select(.name==\"$NAME\") | .id")
            if [ -n "$EXISTING" ]; then
              curl -s -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$EXISTING" >/dev/null
            fi
            curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$APK" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets?name=$NAME" \
              | jq -r '"   uploaded: " + (.browser_download_url // .message)'
          done
